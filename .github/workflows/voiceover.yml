name: VoiceOver journeys

on:
  workflow_dispatch:
    inputs:
      preview_theme_id:
        description: "Shopify theme id to preview (blank = the live theme)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: voiceover
  cancel-in-progress: false

jobs:
  aracna-checkout:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OUT_DIR: transcripts/aracna-checkout
      PREVIEW_THEME_ID: ${{ inputs.preview_theme_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up macOS for VoiceOver automation
        run: npx guidepup setup --ci --macos-record
      - name: Install VoiceOver assets for this Guidepup version
        run: npx guidepup install voiceover
      - run: npx playwright install webkit
      # The runner's bottom-right hot corner opens a Quick Note, which steals the VoiceOver cursor mid-journey.
      - name: Turn off hot corners
        run: |
          for c in tl tr bl br; do
            defaults write com.apple.dock "wvous-$c-corner" -int 1
            defaults write com.apple.dock "wvous-$c-modifier" -int 0
          done
          killall Dock || true
          osascript -e 'quit app "Notes"' || true
      - name: Run the journey with VoiceOver
        run: npm run test:voiceover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voiceover-aracna-checkout-${{ github.run_id }}
          path: |
            transcripts/**/*
            test-results/**/*
            playwright-report/**/*
            recordings/**/*
          retention-days: 30
