name: Accessibility tree diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empty-menus:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      OUT_DIR: transcripts/diagnose
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up macOS for accessibility automation
        run: npx guidepup setup --ci
      - run: npx playwright install webkit
      - name: Dump the accessibility tree
        run: npx playwright test --config ./playwright.config.ts tests/diagnose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-empty-menus-${{ github.run_id }}
          path: |
            transcripts/**/*
            test-results/**/*
          retention-days: 30
